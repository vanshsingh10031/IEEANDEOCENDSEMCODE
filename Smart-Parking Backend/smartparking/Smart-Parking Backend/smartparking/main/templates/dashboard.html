<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Parking Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      text-align: center;
    }
    h1 { margin-top: 20px; }
    .slot-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 50px;
    }
    .slot {
      width: 120px;
      height: 80px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
    }
    .free { background: #1e7d32; }     /* green */
    .occupied { background: #b71c1c; } /* red */
    .label { font-size: 24px; margin-bottom: 6px; }
    .status { font-size: 14px; }
  </style>
</head>
<body>
  <h1>Smart Parking Dashboard</h1>
  <p>Auto-refreshing every 1s</p>

  <div class="slot-container" id="slots"></div>
  
  <h2>Debug / Serial Log</h2>
<pre id="debug-box">Waiting for data...</pre>

  <script>
    

    async function loadSlots() {
      try {
        const res = await fetch("/api/slots/status/");
        const data = await res.json();

        const container = document.getElementById("slots");
        container.innerHTML = "";
  


        data.slots.forEach(slot => {
          const div = document.createElement("div");
          div.className = "slot " + (slot.is_occupied ? "occupied" : "free");
          div.innerHTML = `
            <div class="label">${slot.label}</div>
            <div class="status">${slot.is_occupied ? "Occupied" : "Free"}</div>
          `;
          container.appendChild(div);
        });

            // 👇 this part updates the debug log
    const debugBox = document.getElementById("debug-box");
    if (data.debug_log) {
      debugBox.textContent = data.debug_log;
    }

      } catch (err) {
        console.error("Error fetching slots:", err);
      }
    }

    loadSlots();                 // initial load
    setInterval(loadSlots, 1000); // refresh every second
  </script>
</body>
</html>
