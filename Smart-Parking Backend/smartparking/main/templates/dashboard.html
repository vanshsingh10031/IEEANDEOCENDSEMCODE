<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Smart Parking Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      text-align: center;
    }
    h1 { margin-top: 20px; }
    .slot-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }
    .slot {
      width: 120px;
      height: 80px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .slot.free { background: #1e7d32; }     /* green */
    .slot.occupied { background: #b71c1c; } /* red */
    .slot.highlight {
      outline: 3px solid gold;
      box-shadow: 0 0 15px gold;
      transform: scale(1.05);
    }
    .label { font-size: 24px; margin-bottom: 6px; }
    .status { font-size: 14px; }

    .find-panel {
      margin-top: 30px;
    }
    .find-input {
      padding: 8px 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background: #222;
      color: #eee;
      outline: none;
      min-width: 140px;
    }
    .find-btn-main {
      padding: 8px 16px;
      margin-left: 8px;
      border-radius: 6px;
      border: none;
      background: #1976d2;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    .find-btn-main:hover {
      background: #1565c0;
    }
    .stop-btn {
      padding: 8px 16px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
      background: #555;
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    .stop-btn:hover {
      background: #666;
    }
    .hint {
      font-size: 12px;
      color: #aaa;
      margin-top: 4px;
    }

    pre {
      text-align: left;
      max-width: 600px;
      margin: 10px auto 40px;
      background: #000;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #333;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Smart Parking Dashboard</h1>
  <p>Auto-refreshing every 1s</p>

  <div class="slot-container" id="slots"></div>

  <div class="find-panel">
    <h2>Find My Car</h2>
    <input
      id="slot-input"
      class="find-input"
      placeholder="Enter S1 / S2 / S3"
    />
    <button class="find-btn-main" onclick="handleFindClick()">
      Find
    </button>
    <div class="hint">Example: type <b>S1</b> and press Find</div>

    <button class="stop-btn" onclick="stopFindMyCar()">
      Stop Blinking
    </button>
  </div>

  <h2>Debug / Serial Log</h2>
  <pre id="debug-box">Waiting for data...</pre>

  <script>
  async function loadSlots() {
    const res = await fetch("/api/slots/status/");
    const data = await res.json();

    const container = document.getElementById("slots");
    container.innerHTML = "";

    data.slots.forEach(slot => {
      const div = document.createElement("div");
      div.className = "slot " + (slot.is_occupied ? "occupied" : "free");

      if (slot.find_my_car) {
        div.classList.add("highlight");
      }

      div.innerHTML = `
        <div class="label">${slot.label}</div>
        <div class="status">${slot.is_occupied ? "Occupied" : "Free"}</div>
      `;

      container.appendChild(div);
    });

    // debug log
    const debugBox = document.getElementById("debug-box");
    if (debugBox && data.debug_log) {
      debugBox.textContent = data.debug_log;
    }
  }

  async function findMyCar(slotId) {
    await fetch("/api/slots/find/", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: slotId })
    });
    loadSlots();
  }

  function handleFindClick() {
    const input = document.getElementById("slot-input");
    let value = input.value.trim().toUpperCase(); // normalize

    if (!value) return;

    // Allow user to type "A1" or "S1" if you ever map them;
    // for now we assume they type S1/S2/S3 directly.
    findMyCar(value);
  }

  async function stopFindMyCar() {
    await fetch("/api/slots/find/stop/", {
      method: "POST",
      headers: { "Content-Type": "application/json" }
    });
    loadSlots();
  }

  // call periodically
  setInterval(loadSlots, 1000);
  window.onload = loadSlots;
  </script>

</body>
</html>
